upstream backend  { server backend:8000; }
upstream frontend { server frontend:3000; }

# Enable gzip compression at nginx level
gzip on;
gzip_types text/plain application/json application/javascript text/css text/xml;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_vary on;

server {
    listen 80;

    # SSE streaming — disable buffering so events reach the browser immediately
    location /api/monitoring/stream {
        proxy_pass http://backend/monitoring/stream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # API requests → FastAPI backend
    location /api/ {
        proxy_pass http://backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # WebSocket SSH sessions → backend
    location /ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Static JS/CSS/fonts — long-lived cache (Vite hashes filenames)
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|ico|webp)$ {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # React SPA — no cache on index.html so new deploys are picked up
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-cache";
    }

    # Prometheus metrics (internal only — restrict in production)
    location /metrics {
        proxy_pass http://backend/metrics;
        proxy_set_header Host $host;
    }
}
