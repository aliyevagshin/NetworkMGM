<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NMS — Network Management System</title>
  </head>
  <body class="bg-bg text-white font-sans">
    <div id="root">
      <div id="preload-msg" style="color:#e8eaf0;padding:40px;font-family:sans-serif;font-size:16px">
        Loading NMS...
      </div>
    </div>
    <script>
      // Remove loading message once JS module starts running
      document.addEventListener("DOMContentLoaded", function() {
        setTimeout(function() {
          var el = document.getElementById("preload-msg");
          if (el && el.parentNode.childNodes.length === 1) {
            el.style.color = "#ef4444";
            el.textContent = "React failed to mount. Check browser console (F12).";
          }
        }, 5000);
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
